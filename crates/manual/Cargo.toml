[package]
name = "pi-clock-manual"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Process-global manually refreshed monotonic clocks"
documentation = "https://docs.rs/pi-clock-manual"

[features]
default = []
auto-refresh = ["dep:polling", "dep:arc-swap", "dep:atomic-take", "dep:oneshot"]
browser = ["pi-clock-platform/browser"]

[dependencies]
pi-clock-core = { version = "0.1", path = "../core" }
pi-clock-platform = { version = "0.1", path = "../platform" }
pi_result.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android"))'.dependencies]
polling = { version = "3.11", optional = true }
arc-swap = { version = ">=1.9.5, <2", optional = true, default-features = false }
atomic-take = { version = "1.1", optional = true }
oneshot = { version = "0.2", optional = true, default-features = false, features = ["std"] }
